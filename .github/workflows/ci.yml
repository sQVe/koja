name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Runners have different CPU models, and a native build misses the VT cache on each one. Every
  # GitHub-hosted x86_64 runner supports this level.
  KOJA_VT_CPU: x86_64_v3

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/koja
          key: vt-${{ runner.os }}-${{ env.KOJA_VT_CPU }}-${{ hashFiles('scripts/buildVt.sh', 'patches/**', 'src/vt/shim.c') }}
      - run: bun run build:vt
      - run: bun run --bun format:check
      - run: bun run --bun style:check
      - run: bun run --bun typecheck
      - run: bun run --bun knip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The pi extension test runs the pinned pi, which needs Node 22.19 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/koja
          key: vt-${{ runner.os }}-${{ env.KOJA_VT_CPU }}-${{ hashFiles('scripts/buildVt.sh', 'patches/**', 'src/vt/shim.c') }}
      - run: bun run build
      - run: bun run --bun test

  mutation:
    name: Mutation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The job is advisory and has no mutant cap, so time bounds it. Mutating every production file
    # under src/ took about 2 minutes locally with Stryker's 4 workers.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/koja
          key: vt-${{ runner.os }}-${{ env.KOJA_VT_CPU }}-${{ hashFiles('scripts/buildVt.sh', 'patches/**', 'src/vt/shim.c') }}
      - run: bun run build:vt
      # Stryker reuses a result while the mutated code and the tests that covered it are unchanged. It
      # does not see fixtures, dependencies, config, or the VT library, so their hash is part of the
      # key. A change to unmutated production code can still leave a stale result.
      - id: incremental
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tau/stryker-incremental.json
          key: mutation-incremental-${{ github.event.pull_request.number }}-${{ hashFiles('src/**/*.test.ts', 'src/**/*.test.tsx', 'src/**/*Fixtures.ts', 'bun.lock', 'stryker.config.json', 'bunfig.toml', 'bunfig.mutation.toml', 'scripts/buildVt.sh', 'patches/**', 'src/vt/shim.c') }}-${{ github.sha }}
          restore-keys: mutation-incremental-${{ github.event.pull_request.number }}-${{ hashFiles('src/**/*.test.ts', 'src/**/*.test.tsx', 'src/**/*Fixtures.ts', 'bun.lock', 'stryker.config.json', 'bunfig.toml', 'bunfig.mutation.toml', 'scripts/buildVt.sh', 'patches/**', 'src/vt/shim.c') }}-
      - name: Mutate the changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base HEAD "origin/${BASE_REF}")"
          mapfile -t command < <(jq --raw-output '.mutation.argv[]' .pi/tau.json)
          # The job has the runner to itself, so it uses every CPU. Local runs leave room for other work.
          config="${RUNNER_TEMP}/stryker.config.json"
          jq '.concurrency = "100%"' stryker.config.json > "$config"
          status=0
          "${command[@]}" changed "$base" --config "$config" > mutation.json || status=$?
          cat mutation.json
          exit "$status"
      # The job fails on survivors, and actions/cache saves only after a passing job.
      - if: always() && steps.incremental.outputs.cache-hit != 'true' && hashFiles('.tau/stryker-incremental.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tau/stryker-incremental.json
          key: ${{ steps.incremental.outputs.cache-primary-key }}
