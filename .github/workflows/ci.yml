name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/koja
          key: vt-${{ runner.os }}-${{ hashFiles('scripts/buildVt.sh', 'patches/**', 'src/vt/shim.c') }}
      - run: bun run build:vt
      - run: bun run --bun format:check
      - run: bun run --bun style:check
      - run: bun run --bun typecheck
      - run: bun run --bun knip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The pi extension test runs the pinned pi, which needs Node 22.19 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/koja
          key: vt-${{ runner.os }}-${{ hashFiles('scripts/buildVt.sh', 'patches/**', 'src/vt/shim.c') }}
      - run: bun run build
      - run: bun run --bun test

  mutation:
    name: Mutation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The job is advisory and has no mutant cap, so time bounds it. Mutating every production file
    # under src/ took about 2 minutes locally with Stryker's 4 workers.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/koja
          key: vt-${{ runner.os }}-${{ hashFiles('scripts/buildVt.sh', 'patches/**', 'src/vt/shim.c') }}
      - run: bun run build:vt
      - name: Mutate the changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base HEAD "origin/${BASE_REF}")"
          mapfile -t command < <(jq --raw-output '.mutation.argv[]' .pi/tau.json)
          status=0
          "${command[@]}" changed "$base" > mutation.json || status=$?
          cat mutation.json
          exit "$status"
